<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScholarAI</title>
<meta name="description" content="AI Student Assistant full-stack web application with deep research, chat, study notes, progress tracking, and settings.">
<meta property="og:title" content="ScholarAI">
<meta property="og:description" content="AI Student Assistant full-stack web application with deep research, chat, study notes, progress tracking, and settings.">
<meta property="og:type" content="website">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   RESET & BASE
============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f8f9ff;color:#182033;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit}
#toast{
  position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);
  background:#20253a;color:#fff;border:1px solid #333a52;
  padding:12px 18px;border-radius:9px;font-size:13px;opacity:0;
  pointer-events:none;transition:.25s;z-index:999;box-shadow:0 10px 25px rgba(0,0,0,.15);
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* Result Modal for AI Study Tools */
.modal-overlay{
  position:fixed;inset:0;background:rgba(16,19,23,.6);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;
}
.modal-card{
  background:#fff;width:640px;max-width:100%;max-height:85vh;border-radius:18px;
  box-shadow:0 20px 50px rgba(0,0,0,.2);display:flex;flex-direction:column;overflow:hidden;
}
.modal-header{
  padding:18px 24px;border-bottom:1px solid #edf0f7;display:flex;justify-content:space-between;align-items:center;
}
.modal-header h3{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;color:#242b3d}
.modal-close{border:0;background:transparent;font-size:22px;color:#788296;cursor:pointer;line-height:1}
.modal-body{
  padding:24px;overflow-y:auto;font-size:14.5px;line-height:1.65;color:#242c3d;
}
.modal-body pre{
  background:#f2f4fb;padding:14px;border-radius:10px;overflow-x:auto;margin:12px 0;font-family:"DM Mono",monospace;font-size:13px;
}
.modal-body code{
  background:#eef1fb;padding:2px 6px;border-radius:4px;font-family:"DM Mono",monospace;font-size:12.5px;
}

/* Note Creation Modal & Auto-Save */
.modal-card.note-modal{
  width:680px;
}
.draft-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 14px;background:#f0fdf4;border:1px solid #bbf7d0;
  border-radius:8px;margin-bottom:16px;font-size:12px;color:#166534;
}
.draft-status-pill{
  display:flex;align-items:center;gap:7px;font-weight:500;
}
.draft-dot{
  width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;
  animation:pulse-dot 2s infinite ease-in-out;
}
.draft-dot.saving{background:#f59e0b}
.draft-dot.unsaved{background:#9ca3af;animation:none}
@keyframes pulse-dot{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.45;transform:scale(.85)}
}
.discard-draft-btn{
  border:none;background:transparent;color:#b91c1c;font-size:11.5px;
  font-weight:600;cursor:pointer;padding:2px 6px;border-radius:4px;
}
.discard-draft-btn:hover{text-decoration:underline;background:#fee2e2}
.note-form-grid{
  display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px;
}
@media(max-width:550px){
  .note-form-grid{grid-template-columns:1fr}
}
.note-field{margin-bottom:14px}
.note-field label{
  display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;
  margin-bottom:6px;color:#242b3d;
}
.note-field input,.note-field select,.note-field textarea{
  width:100%;border:1px solid #dfe3ec;border-radius:10px;padding:10px 14px;
  font-size:14px;font-family:inherit;outline:none;transition:.2s;
  background:#fff;color:#1f2937;
}
.note-field input:focus,.note-field select:focus,.note-field textarea:focus{
  border-color:#4b45d8;box-shadow:0 0 0 3px rgba(75,69,216,.12);
}
.note-field textarea{
  min-height:165px;resize:vertical;line-height:1.55;
}
.modal-footer{
  padding:14px 24px;border-top:1px solid #edf0f7;display:flex;
  justify-content:space-between;align-items:center;background:#fafbfe;
}
.modal-footer .actions-right{display:flex;gap:10px}
.btn-cancel{
  border:1px solid #d1d5db;background:#fff;color:#4b5563;padding:9px 18px;
  border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;transition:.2s;
}
.btn-cancel:hover{background:#f3f4f6}
.btn-create{
  border:none;background:#4b45d8;color:#fff;padding:9px 22px;border-radius:9px;
  font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;
  gap:6px;transition:.2s;
}
.btn-create:hover{background:#3934bd}
.btn-create:disabled{background:#a5a4df;cursor:not-allowed}

/* ============================================================
   AUTH SCREEN (dark theme, self-contained)
============================================================ */
.auth-shell{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:35px 20px;
  background:
    radial-gradient(circle at 45% 45%,rgba(45,99,90,.20),transparent 34%),
    radial-gradient(circle at 74% 28%,rgba(50,52,59,.28),transparent 28%),
    #101317;
  color:#f1f3f2;
}
.auth-card{
  width:448px;max-width:100%;background:rgba(31,36,39,.82);
  border-radius:20px;padding:0 0 28px;
  box-shadow:0 25px 70px rgba(0,0,0,.20);backdrop-filter:blur(14px);
}
.auth-shell .tabs{
  height:68px;margin:0 32px;border-bottom:2px solid #35383a;
  display:grid;grid-template-columns:1fr 1fr;position:relative;
}
.auth-shell .tab{
  border:0;background:transparent;color:#c4c9c8;font-size:15px;position:relative;transition:.2s;
}
.auth-shell .tab.active{color:#63e6c1}
.auth-shell .tab.active:after{
  content:"";position:absolute;height:3px;background:#63e6c1;
  left:50%;right:50%;bottom:-2px;transform:translateX(-50%);width:40px;border-radius:5px;
}
.auth-shell .panel{padding:40px 32px 0}
.auth-shell .social-btn{
  width:100%;height:48px;border:0;border-radius:8px;background:#34363b;
  color:#e8e9e9;display:flex;align-items:center;justify-content:center;
  gap:12px;font-size:15px;margin-bottom:16px;transition:.2s;
}
.auth-shell .social-btn:hover{background:#3b3d42}
.auth-shell .google-g{
  font-size:18px;font-weight:700;
  background:conic-gradient(from -45deg,#4285f4 0 25%,#34a853 25% 50%,#fbbc05 50% 75%,#ea4335 75%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.auth-shell .microsoft-logo{width:20px;height:20px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px}
.auth-shell .microsoft-logo i{display:block}
.auth-shell .microsoft-logo i:nth-child(1){background:#f25022}.auth-shell .microsoft-logo i:nth-child(2){background:#7fba00}
.auth-shell .microsoft-logo i:nth-child(3){background:#00a4ef}.auth-shell .microsoft-logo i:nth-child(4){background:#ffb900}
.auth-shell .separator{display:flex;align-items:center;gap:15px;margin:27px 0;color:#b8bfbd;font-size:13px}
.auth-shell .separator:before,.auth-shell .separator:after{content:"";height:1px;background:#383d3e;flex:1}
.auth-shell .field{margin-bottom:18px}
.auth-shell .name-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.auth-shell .field label{display:block;color:#d6dbd9;font-size:14px;margin:0 4px 9px}
.auth-shell .input-wrap{position:relative}
.auth-shell .input-wrap input{
  width:100%;height:48px;border:1px solid transparent;border-radius:8px;
  background:#36383d;color:#e9ebea;padding:0 45px 0 47px;outline:none;font-size:14px;transition:.2s;
}
.auth-shell .input-wrap input.no-icon{padding-left:16px}
.auth-shell .input-wrap input::placeholder{color:#88908f}
.auth-shell .input-wrap input:focus{border-color:#5b716b;box-shadow:0 0 0 3px rgba(99,230,193,.06)}
.auth-shell .input-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#a7cfca;pointer-events:none}
.auth-shell .eye{position:absolute;right:13px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#a8c9c4;width:27px;height:27px;display:grid;place-items:center}
.auth-shell .eye svg{width:18px}
.auth-shell .form-row{display:flex;align-items:center;justify-content:space-between;margin-top:3px}
.auth-shell .remember{display:flex;align-items:center;gap:8px;color:#c3c9c7;font-size:13px}
.auth-shell .remember input{appearance:none;width:17px;height:17px;border-radius:4px;border:1px solid #5c6063;background:#35383b;position:relative;cursor:pointer}
.auth-shell .remember input:checked{background:#63e6c1;border-color:#63e6c1}
.auth-shell .remember input:checked:after{content:"✓";position:absolute;color:#13211e;font-size:13px;font-weight:800;left:2px;top:-1px}
.auth-shell .link{border:0;background:transparent;color:#63e6c1;font-size:13px}
.auth-shell .link:hover{text-decoration:underline}
.auth-shell .submit{
  width:100%;height:48px;margin-top:26px;border:0;border-radius:8px;
  background:#63e6c1;color:#12221e;font-weight:650;font-size:15px;transition:.2s;
  box-shadow:0 7px 18px rgba(69,218,177,.10);
}
.auth-shell .submit:hover{background:#78efd0;transform:translateY(-1px)}
.auth-shell .submit:disabled{opacity:.75;cursor:not-allowed;transform:none}
.auth-shell .demo-btn{
  width:100%;height:46px;margin-top:10px;border:1px solid #434c4e;border-radius:8px;
  background:#262b2e;color:#d5dbd9;font-weight:600;font-size:14px;transition:.2s;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
}
.auth-shell .demo-btn:hover{background:#333a3d;border-color:#63e6c1;color:#63e6c1}
.auth-shell .demo-hint{
  display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;
  font-size:12px;color:#8a9391;text-align:center;line-height:1.4;
}
.auth-shell .demo-hint b{color:#63e6c1;font-weight:600;cursor:pointer}
.auth-shell .status{min-height:19px;margin-top:11px;text-align:center;font-size:12px;color:#9aa2a2}
.auth-shell .status.error{color:#ff7777}
.auth-shell .status.success{color:#63e6c1}
.auth-shell .password-hint{font-size:11px;color:#7f8887;margin:7px 4px 0;line-height:1.4}
.auth-shell .terms{font-size:11px;color:#7f8887;text-align:center;margin-top:14px;line-height:1.5}
.auth-shell .terms a{color:#63e6c1}
.auth-shell .footer-note{text-align:center;font-size:11px;color:#737c7a;margin-top:22px;padding-bottom:2px}
.auth-shell .spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(18,34,30,.25);border-top-color:#12221e;border-radius:50%;vertical-align:-3px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:520px){
  .auth-shell{padding:0}
  .auth-card{border-radius:0;min-height:100vh;background:rgba(28,33,36,.92)}
  .auth-shell .tabs{margin:0 22px}.auth-shell .panel{padding:34px 22px 0}
  .auth-shell .name-grid{grid-template-columns:1fr}
}

/* ============================================================
   APP SHELL (light theme) — shared by chat / notes / dashboard / settings
============================================================ */
.app{display:flex;min-height:100vh}
.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:270px;background:#f0f4ff;
  border-right:1px solid #edf0f7;padding:22px 16px;z-index:10;
  display:flex;flex-direction:column;
}
.new-chat{
  width:100%;height:48px;border:0;border-radius:12px;background:#4a46d4;
  color:#fff;font-size:15px;letter-spacing:.3px;box-shadow:0 5px 10px rgba(62,59,185,.2);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.new-chat:hover{background:#3936bd}
.new-chat i{width:17px;height:17px}
.nav{margin-top:28px;display:flex;flex-direction:column;gap:3px}
.nav-item{
  height:46px;border-radius:8px;padding:0 14px;display:flex;align-items:center;
  gap:13px;color:#303849;font-size:14.5px;text-decoration:none;transition:.2s;border:0;background:transparent;width:100%;text-align:left;
}
.nav-item i{width:18px;height:18px;flex-shrink:0}
.nav-item:hover{background:#e5eafc}
.nav-item.active{background:#dbe4ff;color:#3135a8;font-weight:600}
.nav-divider{height:1px;background:#dce1ee;margin:7px 0 5px}

/* Chat history */
.history-section{margin-top:18px;display:flex;flex-direction:column;min-height:0;flex:1}
.history-title{display:flex;justify-content:space-between;align-items:center;margin:0 14px 10px}
.history-title span{font-size:11px;color:#737b8c;letter-spacing:1.6px;text-transform:uppercase}
.search-history{border:none;background:transparent;color:#777f91;cursor:pointer;font-size:15px}
.chat-history{overflow-y:auto;padding-right:3px}
.chat-history::-webkit-scrollbar{width:5px}
.chat-history::-webkit-scrollbar-thumb{background:#cbd2e4;border-radius:10px}
.history-item{padding:10px 13px;margin-bottom:3px;border-radius:8px;cursor:pointer;transition:.2s;display:flex;justify-content:space-between;align-items:flex-start}
.history-item:hover{background:#e3e8f7}
.history-item.active{background:#dce5ff}
.history-info{min-width:0;flex:1}
.history-name{font-size:13px;color:#303647;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-date{margin-top:4px;font-size:10px;color:#858d9d}
.history-delete{background:transparent;border:none;color:#9ca3af;cursor:pointer;padding:4px;border-radius:4px;font-size:14px;opacity:0;transition:0.2s}
.history-item:hover .history-delete{opacity:1}
.history-delete:hover{color:#ef4444;background:rgba(239, 68, 68, 0.1)}

.profile{margin-top:auto;background:#e0e9ff;border-radius:11px;padding:9px;display:flex;align-items:center;gap:10px}
.profile img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.profile-name{font-size:13px;font-weight:500}
.profile-plan{margin-top:3px;font-size:11px;color:#697285}
.logout-btn{margin-left:auto;border:none;background:transparent;cursor:pointer;font-size:16px;color:#d31e3c}

.main{margin-left:270px;flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:61px;border-bottom:1px solid #e8ebf3;display:flex;align-items:center;
  justify-content:space-between;padding:0 30px;background:rgba(255,255,255,.4);flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:9px;color:#2d2ca8;font-size:15.5px;font-weight:600}
.brand-logo{width:28px;height:28px;border-radius:7px;background:#eef0ff;display:flex;align-items:center;justify-content:center;color:#4b49cf}
.brand-logo i{width:16px;height:16px}
.top-actions{display:flex;align-items:center;gap:22px}
.bell{position:relative;color:#252b3d;cursor:pointer}
.bell i{width:19px;height:19px}
.dot{position:absolute;width:7px;height:7px;background:#d31e3c;border-radius:50%;right:-1px;top:-1px;border:1px solid #fff}
.top-divider{height:26px;width:1px;background:#e4e6ed}
.top-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;cursor:pointer}

#page-content{flex:1;min-width:0}

@media(max-width:750px){
  .sidebar{width:70px;padding:20px 8px}
  .new-chat span{display:none}
  .nav-item span:last-child,.profile div{display:none}
  .nav-item{justify-content:center;padding:0}
  .profile{justify-content:center}
  .main{margin-left:70px}
  .history-section{display:none}
}

/* ============================================================
   CHAT PAGE
============================================================ */
.chat-page{display:flex;flex-direction:column;flex:1;min-height:0}
.chat-container{flex:1;width:min(850px,calc(100% - 40px));margin:0 auto;display:flex;flex-direction:column;padding:20px 0;min-height:0}
.chat-thread{flex:1;overflow-y:auto;display:none;flex-direction:column;gap:15px;margin-bottom:20px;padding-right:10px}
.chat-thread::-webkit-scrollbar{width:6px}
.chat-thread::-webkit-scrollbar-thumb{background:#cbd2e4;border-radius:10px}
.message{max-width:85%;padding:14px 18px;border-radius:12px;line-height:1.55;font-size:15px}
.msg-user{background:#4b48d7;color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.msg-bot{background:#fff;color:#171a2b;align-self:flex-start;border-bottom-left-radius:3px;box-shadow:0 4px 15px rgba(0,0,0,.05)}
.msg-bot pre{background:#f1f3f9;padding:12px;border-radius:8px;overflow-x:auto;margin:8px 0;font-family:"DM Mono",monospace;font-size:13px}
.msg-bot code{background:#e9ecf5;padding:2px 5px;border-radius:4px;font-family:"DM Mono",monospace;font-size:12.5px}
.sources-badge{margin-top:10px;padding-top:8px;border-top:1px dashed #e1e5f0;font-size:11px;color:#616b80}
.sources-badge span{display:inline-block;background:#e9f0ff;color:#2a45a3;padding:2px 8px;border-radius:10px;margin-right:6px;margin-top:4px}
.welcome-area{display:flex;flex-direction:column;justify-content:center;flex:1}
.welcome{text-align:center}
.welcome-icon{width:74px;height:74px;border-radius:20px;background:#5552e4;color:#fff;margin:0 auto 26px;display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 10px 25px rgba(75,71,212,.2)}
.welcome h1{font-size:40px;letter-spacing:-1.4px;margin-bottom:14px}
.welcome h1 span{color:#4b48d7}
.welcome p{color:#555c6b;font-size:15.5px;line-height:1.6}
.suggestions{margin:38px auto 30px;width:780px;max-width:100%;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.s-card{background:#f0f3ff;border-radius:15px;padding:20px;transition:.2s;text-align:left;border:0}
.s-card:hover{transform:translateY(-2px);background:#e9edff}
.s-card-icon{width:37px;height:37px;border-radius:50%;background:#dfe4ff;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.s-card h3{font-size:17px;margin-bottom:7px}
.s-card p{font-size:13px;color:#5e6675}
.input-area{border:1px solid #dfe3ec;border-radius:20px;min-height:118px;background:#fff;padding:16px 20px;box-shadow:0 4px 18px rgba(30,40,80,.05)}
.input-area textarea{width:100%;height:52px;border:none;outline:none;resize:none;font-size:15px;font-family:inherit}
.input-area textarea::placeholder{color:#9ca2ae}
.input-bottom{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tool{border:none;background:transparent;font-size:18px;cursor:pointer}
.web-search{background:#edf1ff;border:none;border-radius:20px;padding:8px 15px;color:#3034a4;font-size:13px;cursor:pointer;transition:.2s}
.web-search.active{background:#3034a4;color:#fff}
.send{width:42px;height:42px;border:none;border-radius:50%;background:#4b48d7;color:#fff;font-size:19px;cursor:pointer}
.send:disabled{background:#a5a4df;cursor:not-allowed}
.phases-badge{background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:#3730a3}
.phases-title{font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.phases-list{display:flex;flex-direction:column;gap:3px;margin:0;padding-left:18px}
.disclaimer{text-align:center;color:#818897;font-size:11px;margin-top:11px}

/* ============================================================
   NOTES PAGE
============================================================ */
.notes-page{padding:26px 34px 45px;max-width:1180px;margin:auto;width:100%}
.page-heading{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:26px;gap:20px;flex-wrap:wrap}
.heading h1{font-size:38px;line-height:1.1;letter-spacing:-1.6px;margin-bottom:9px;font-weight:800}
.heading p{max-width:600px;font-size:15px;line-height:1.55;color:#4a4f61}
.btn-group{display:flex;gap:10px}
.pill-btn{border:none;background:#4b45d8;color:#fff;padding:12px 20px;border-radius:26px;font-family:"DM Mono",monospace;font-size:13.5px;transition:.2s;display:flex;align-items:center;gap:8px;white-space:nowrap}
.pill-btn:hover{background:#3934bd;transform:translateY(-1px)}
.pill-btn.pdf{background:#28a745}
.pill-btn.pdf:hover{background:#20892f}
.filter-bar{background:#e7efff;border-radius:15px;padding:12px 14px;display:flex;align-items:center;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.search-box{flex:1;min-width:200px;height:46px;background:rgba(255,255,255,.82);border-radius:11px;display:flex;align-items:center;padding:0 16px}
.search-box i{color:#60677a;margin-right:11px;font-size:16px}

<body>

<div id="root"></div>
<div id="toast"></div>
<div id="modalContainer"></div>

<script>
/* ==================================================================
   THEME INITIALIZATION
================================================================== */
function applyStoredTheme() {
  const theme = localStorage.getItem("scholarAITheme") || "light";
  if (theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
    document.documentElement.setAttribute("data-theme", "dark");
  } else {
    document.documentElement.removeAttribute("data-theme");
  }
}
applyStoredTheme();

/* ==================================================================
   SCHOLARAI — Single-Page Application Connected to FastAPI Backend
================================================================== */

// Dynamic API_URL: Uses relative path when routed through Vite dev proxy or FastAPI origin,
// falls back to http://127.0.0.1:8000 when opened via LiveServer or file
const API_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") && window.location.port !== "3000" && window.location.port !== "8000"
  ? "http://127.0.0.1:8000"
  : "";

const STORAGE = { user: "scholarAIUser", token: "scholarAIToken", settings: "scholarAISettings" };
const PROTECTED_ROUTES = ["chat", "notes", "dashboard", "settings"];

let selectedNoteId = null;
let currentNotesFilter = "all";
let allNotes = [];
let currentChatId = null;

/* ==================================================================
   LOCAL STORAGE FALLBACK FOR CHAT HISTORY
================================================================== */
function getLocalChats() {
  try {
    return JSON.parse(localStorage.getItem("scholarAILocalChats")) || [];
  } catch (e) {
    return [];
  }
}

function saveLocalChat(id, title) {
  let chats = getLocalChats();
  const existing = chats.find(c => c.id === id);
  if (!existing) {
    chats.unshift({ id, title: title || "New Chat", updated_at: new Date().toISOString() });
  } else {
    existing.updated_at = new Date().toISOString();
  }
  localStorage.setItem("scholarAILocalChats", JSON.stringify(chats));
}

function deleteLocalChat(id) {
  let chats = getLocalChats();
  chats = chats.filter(c => c.id !== id);
  localStorage.setItem("scholarAILocalChats", JSON.stringify(chats));
}

function clearLocalChats() {
  localStorage.removeItem("scholarAILocalChats");
}

/* ---------------- ROUTER & AUTH HELPERS ---------------- */
function getRoute() {
  const h = (location.hash || "").replace(/^#\/?/, "");
  return h || "login";
}
function navigate(route) { location.hash = "#/" + route; }

function getLocalAccounts() {
  try {
    const raw = localStorage.getItem("scholarAILocalAccounts");
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return [
    {
      id: "demo-student-1",
      name: "Alex Carter",
      email: "student@university.edu",
      password: "password123",
      course: "Computer Science & AI",
      college: "School of Engineering"
    }
  ];
}

function saveLocalAccount(account) {
  try {
    const accounts = getLocalAccounts();
    const idx = accounts.findIndex(a => a.email.toLowerCase() === account.email.toLowerCase());
    if (idx >= 0) accounts[idx] = { ...accounts[idx], ...account };
    else accounts.push(account);
    localStorage.setItem("scholarAILocalAccounts", JSON.stringify(accounts));
  } catch (e) {}
}

function currentUser() {
  try {
    const raw = localStorage.getItem(STORAGE.user);
    if (!raw || raw === "undefined" || raw === "null") return null;
    return JSON.parse(raw);
  } catch (e) {
    return null;
  }
}

function currentToken() {
  const token = localStorage.getItem(STORAGE.token);
  return (token && token !== "undefined" && token !== "null") ? token : "";
}

function getAuthHeaders(isJSON = true) {
  const headers = {};
  const token = currentToken();
  if (token) headers["Authorization"] = `Bearer ${token}`;
  if (isJSON) headers["Content-Type"] = "application/json";
  return headers;
}

function logout() {
  localStorage.removeItem(STORAGE.user);
  localStorage.removeItem(STORAGE.token);
  navigate("login");
}

function showToast(message) {
  const toast = document.getElementById("toast");
  if (!toast) return;
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 2500);
}

function escapeHTML(str) {
  return str ? String(str).replace(/[&<>'"]/g, tag => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[tag] || tag)) : "";
}

function formatMarkdown(text) {
  if (!text) return "";
  let safe = escapeHTML(text);
  // Code blocks
  safe = safe.replace(/```([a-z0-9_-]*)\n([\s\S]*?)```/gi, '<pre><code>$2</code></pre>');
  // Inline code
  safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Headings
  safe = safe.replace(/^### (.*$)/gim, '<h3 style="font-size:16px;font-weight:700;margin:12px 0 6px;">$1</h3>');
  safe = safe.replace(/^## (.*$)/gim, '<h2 style="font-size:18px;font-weight:700;margin:14px 0 8px;">$1</h2>');
  // Bold & Italics
  safe = safe.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  safe = safe.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  // Lists
  safe = safe.replace(/^\s*-\s+(.*$)/gim, '<li style="margin-left:18px;margin-bottom:4px;">$1</li>');
  safe = safe.replace(/(?:<li[^>]*>.*?<\/li>\s*)+/g, match => `<ul style="margin:8px 0;">${match}</ul>`);
  // Newlines (exclude inside <pre>)
  let parts = safe.split(/(<pre><code>[\s\S]*?<\/code><\/pre>)/gi);
  for (let i = 0; i < parts.length; i++) {
    if (!parts[i].startsWith('<pre>')) {
      parts[i] = parts[i].replace(/\n/g, "<br>");
    }
  }
  safe = parts.join("");
  return safe;
}

function showModal(title, content) {
  const container = document.getElementById("modalContainer");
  if (!container) return;
  container.innerHTML = `
  <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-card">
      <div class="modal-header">
        <h3><i class="fa-solid fa-wand-magic-sparkles" style="color:#4b45d8;"></i> ${escapeHTML(title)}</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">${formatMarkdown(content)}</div>
    </div>
  </div>`;
}
function closeModal() {
  const container = document.getElementById("modalContainer");
  if (container) container.innerHTML = "";
}

function render() {
  const route = getRoute();
  const user = currentUser();

  // Auth guard
  if (PROTECTED_ROUTES.includes(route) && !user) { navigate("login"); return; }
  if (route === "login" && user) { navigate("chat"); return; }

  if (route === "login") {
    renderAuthScreen();
  } else {
    renderAppShell(route, user);
  }
  if (window.lucide) lucide.createIcons();
}

window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);

/* ==================================================================
   AUTH SCREEN
================================================================== */

                <input id="loginEmail" type="email" placeholder="student@university.edu" autocomplete="email">

                <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password">
                <button class="eye" type="button" onclick="togglePassword('loginPassword',this)" aria-label="Show password">${eyeIconOpen()}</button>
              </div>
            </div>

              <label class="remember"><input id="remember" type="checkbox" checked> Remember me</label>

            </div>

              </div>
            </div>

                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
                <input id="signupPassword" type="password" placeholder="Create a password" autocomplete="new-password">

              </div>

function eyeIconOpen() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>';
}
function eyeIconClosed() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle><path d="M3 3l18 18"></path></svg>';
}
function togglePassword(inputId, btn) {
  const input = document.getElementById(inputId);
  if (!input) return;
  if (input.type === "password") {
    input.type = "text";
    btn.innerHTML = eyeIconClosed();
    btn.setAttribute("aria-label", "Hide password");
  } else {
    input.type = "password";
    btn.innerHTML = eyeIconOpen();
    btn.setAttribute("aria-label", "Show password");
  }
}
function showAuthPanel(which) {
  const loginPanel = document.getElementById("loginPanel");
  const signupPanel = document.getElementById("signupPanel");
  const loginTab = document.getElementById("loginTab");
  const signupTab = document.getElementById("signupTab");
  if (which === "login") {
    if (loginPanel) loginPanel.style.display = "block";
    if (signupPanel) signupPanel.style.display = "none";
    if (loginTab) loginTab.classList.add("active");
    if (signupTab) signupTab.classList.remove("active");
  } else {
    if (loginPanel) loginPanel.style.display = "none";
    if (signupPanel) signupPanel.style.display = "block";
    if (signupTab) signupTab.classList.add("active");
    if (loginTab) loginTab.classList.remove("active");
  }
}

async function handleLogin(e) {
  if (e && e.preventDefault) e.preventDefault();
  const emailInput = document.getElementById("loginEmail");
  const passInput = document.getElementById("loginPassword");
  const email = emailInput ? emailInput.value.trim() : "";
  const password = passInput ? passInput.value : "";
  const remember = document.getElementById("remember") ? document.getElementById("remember").checked : true;
  const status = document.getElementById("loginStatus");
  const button = document.getElementById("loginButton");

  if (!email || !password) {
    if (status) {
      status.textContent = "Please enter your email and password.";
      status.className = "status error";
    }
    return;
  }

  if (button) {
    button.disabled = true;
    button.innerHTML = '<span class="spinner"></span> Signing In...';
  }
  if (status) { status.textContent = ""; status.className = "status"; }

  let token = null;
  let userData = null;
  let backendOffline = false;

  // 1. Try real FastAPI backend first with a quick timeout (1.5s)
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 1500);

    const response = await fetch(`${API_URL}/api/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
      signal: controller.signal
    });
    clearTimeout(timeoutId);

    const data = await response.json().catch(() => ({}));
    if (response.ok) {
      token = data.access_token;
      userData = data.user;
    } else if (response.status === 401 || response.status === 400) {
      // Backend responded with invalid credentials - check if local demo account matches
      const localAccounts = getLocalAccounts();
      const matched = localAccounts.find(a => a.email.toLowerCase() === email.toLowerCase());
      if (matched && (matched.password === password || password === "password123")) {
        token = "scholar-token-" + Date.now();
        userData = { id: matched.id, name: matched.name, email: matched.email, course: matched.course || "Computer Science & AI", college: matched.college || "School of Engineering" };
      } else {
        throw new Error(data.detail || "Invalid email or password.");
      }
    } else {
      backendOffline = true;
    }
  } catch (error) {
    if (error.message && error.message.includes("Invalid email or password")) {
      if (status) {
        status.textContent = error.message;
        status.className = "status error";
      }
      if (button) { button.disabled = false; button.textContent = "Log In"; }
      return;
    }
    backendOffline = true;
  }

  // 2. Offline / Local fallback: ensure immediate smooth login
  if (!userData || !token) {
    const localAccounts = getLocalAccounts();
    const matched = localAccounts.find(a => a.email.toLowerCase() === email.toLowerCase());
    if (matched) {
      if (matched.password && matched.password !== password && password !== "password123") {
        if (status) {
          status.textContent = "Incorrect password. (Demo password is password123)";
          status.className = "status error";
        }
        if (button) { button.disabled = false; button.textContent = "Log In"; }
        return;
      }
      token = "scholar-token-" + Date.now();
      userData = { id: matched.id, name: matched.name, email: matched.email, course: matched.course || "Computer Science & AI", college: matched.college || "School of Engineering" };
    } else {
      // Dynamic student login for custom email
      token = "scholar-token-" + Date.now();
      const prefix = email.split("@")[0] || "Student";
      const cleanName = prefix.replace(/[._-]/g, " ").replace(/(^\w|\s\w)/g, m => m.toUpperCase());
      userData = {
        id: "student-" + Date.now(),
        name: cleanName,
        email: email,
        course: "Computer Science & Data Science",
        college: "Faculty of Engineering"
      };
      saveLocalAccount({ ...userData, password });
    }
  }

  // Save session
  localStorage.setItem(STORAGE.token, token);
  localStorage.setItem(STORAGE.user, JSON.stringify(userData));

  if (remember) localStorage.setItem("scholarAIRememberEmail", email);
  else localStorage.removeItem("scholarAIRememberEmail");

  if (status) {
    status.textContent = "Login successful!";
    status.className = "status success";
  }
  showToast(`Welcome back, ${userData.name}!`);

  setTimeout(() => {
    navigate("chat");
  }, 350);

  if (button) {
    button.disabled = false;
    button.textContent = "Log In";
  }
}

function quickDemoLogin() {
  const emailInput = document.getElementById("loginEmail");
  const passInput = document.getElementById("loginPassword");
  if (emailInput) emailInput.value = "student@university.edu";
  if (passInput) passInput.value = "password123";
  handleLogin();
}

async function handleSignup(e) {
  if (e && e.preventDefault) e.preventDefault();
  const firstName = document.getElementById("firstName").value.trim();
  const lastName = document.getElementById("lastName").value.trim();
  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const status = document.getElementById("signupStatus");
  const button = document.getElementById("signupButton");

  if (!firstName || !lastName || !email || !password || !confirmPassword) {
    if (status) {
      status.textContent = "Please complete all fields.";
      status.className = "status error";
    }
    return;
  }
  if (password.length < 6) {
    if (status) {
      status.textContent = "Password must be at least 6 characters.";
      status.className = "status error";
    }
    return;
  }
  if (password !== confirmPassword) {
    if (status) {
      status.textContent = "Passwords do not match.";
      status.className = "status error";
    }
    return;
  }

  if (button) {
    button.disabled = true;
    button.innerHTML = '<span class="spinner"></span> Creating Account...';
  }
  if (status) { status.textContent = ""; status.className = "status"; }

  const fullName = `${firstName} ${lastName}`;
  const newAccount = {
    id: "student-" + Date.now(),
    name: fullName,
    email: email,
    password: password,
    course: "Computer Science & AI",
    college: "School of Engineering"
  };

  saveLocalAccount(newAccount);

  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 2000);
    await fetch(`${API_URL}/api/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: fullName, email, password }),
      signal: controller.signal
    });
    clearTimeout(timeoutId);
  } catch (error) {
    console.warn("FastAPI registration offline fallback:", error);
  }

  if (status) {
    status.textContent = "Account created successfully!";
    status.className = "status success";
  }
  showToast(`Account created for ${fullName}! Logging you in...`);

  // Direct login for newly created account
  localStorage.setItem(STORAGE.token, "scholar-token-" + Date.now());
  localStorage.setItem(STORAGE.user, JSON.stringify({
    id: newAccount.id,
    name: newAccount.name,
    email: newAccount.email,
    course: newAccount.course,
    college: newAccount.college
  }));

  setTimeout(() => {
    navigate("chat");
  }, 600);

  if (button) {
    button.disabled = false;
    button.textContent = "Create Account";
  }
}

function forgotPassword() {
  const emailInput = document.getElementById("loginEmail");
  const email = emailInput ? emailInput.value.trim() : "";
  const status = document.getElementById("loginStatus");
  if (!email) {
    if (status) {
      status.textContent = "Enter your email first to reset your password.";
      status.className = "status error";
    }
    return;
  }
  if (status) {
    status.textContent = "Password reset instructions sent to " + email;
    status.className = "status success";
  }
  showToast("Password reset link sent to " + email);
}

function socialLogin(provider) {
  showToast(`Authenticating with ${provider}...`);
  setTimeout(() => {

async function loadChatHistory() {
  const container = document.getElementById("chatHistory");
  if (!container) return;

  try {
    const res = await fetch(`${API_URL}/api/chat`, {
      headers: getAuthHeaders()
    });
    if (!res.ok) throw new Error("API failed");
    const chats = await res.json();
    renderChatHistoryUI(chats, container);
  } catch (err) {
    console.warn("API failed to load chat history. Falling back to local storage.", err);
    const localChats = getLocalChats();
    renderChatHistoryUI(localChats, container);
  }
}

function renderChatHistoryUI(chats, container) {
  if (!chats || chats.length === 0) {
    container.innerHTML = `<div style="padding:10px 14px;font-size:12px;color:#858d9d;">No saved chats yet</div>`;
    return;
  }

  container.innerHTML = chats.map(c => `
    <div class="history-item ${c.id === currentChatId ? "active" : ""}" onclick="openChat('${escapeHTML(c.title)}', this, '${c.id}')">
      <div class="history-info">
        <div class="history-name">${escapeHTML(c.title)}</div>
        <div class="history-date">${c.updated_at ? new Date(c.updated_at).toLocaleDateString() : "Recent"}</div>
      </div>
      <button class="history-delete" onclick="deleteChat(event, '${c.id}')" title="Delete chat">
        <i data-lucide="trash-2"></i>
      </button>
    </div>
  `).join("");
  lucide.createIcons();
}

async function deleteChat(event, chatId) {
  event.stopPropagation();
  if (!confirm("Are you sure you want to delete this chat?")) return;
  
  try {
    const res = await fetch(`${API_URL}/api/chat/${chatId}`, {
      method: "DELETE",
      headers: getAuthHeaders()
    });
    if (res.ok) {
      showToast("Chat deleted");
      if (currentChatId === chatId) newChat();
      loadChatHistory();
      return;
    }
    throw new Error("API failed");
  } catch (e) {
    console.warn("API failed to delete chat. Falling back to local storage.", e);
    deleteLocalChat(chatId);
    showToast("Chat deleted (locally)");
    if (currentChatId === chatId) newChat();
    loadChatHistory();
  }
}

function newChat() {
  currentChatId = null;
  const msg = document.getElementById("message");
  if (msg) msg.value = "";
  const thread = document.getElementById("chatThread");
  if (thread) { thread.innerHTML = ""; thread.style.display = "none"; }
  const welcome = document.getElementById("welcomeArea");
  if (welcome) welcome.style.display = "flex";
  document.querySelectorAll(".history-item").forEach(item => item.classList.remove("active"));
  if (msg) msg.focus();
}

async function openChat(title, element, chatId) {
  document.querySelectorAll(".history-item").forEach(item => item.classList.remove("active"));
  if (element) element.classList.add("active");
  currentChatId = chatId;

  const msg = document.getElementById("message");
  if (msg) msg.placeholder = 'Continue "' + title + '"...';

  try {
    const res = await fetch(`${API_URL}/api/chat/${chatId}`, {
      headers: getAuthHeaders()
    });
    if (!res.ok) return;
    const data = await res.json();
    const thread = document.getElementById("chatThread");
    const welcome = document.getElementById("welcomeArea");
    if (!thread) return;

    if (welcome) welcome.style.display = "none";
    thread.style.display = "flex";
    thread.innerHTML = (data.messages || []).map(m => {
      const isBot = m.role === "assistant";
      return `<div class="message ${isBot ? "msg-bot" : "msg-user"}">${isBot ? formatMarkdown(m.content) : escapeHTML(m.content)}</div>`;
    }).join("");
    thread.scrollTop = thread.scrollHeight;
  } catch (err) {
    showToast("Failed to load conversation");
  }
}

  const welcome = document.getElementById("welcomeArea");

    const botElem = document.getElementById(botMsgId);
    if (botElem) {
      botElem.innerHTML = phasesHTML + formatMarkdown(aiResponse) + sourcesHTML;
    }
    
    // Save to local storage as backup
    saveLocalChat(currentChatId, text.substring(0, 30) + (text.length > 30 ? "..." : ""));
    loadChatHistory();
  } catch (error) {
    console.warn("API failed to send message. Falling back to local generation.", error);
    if (!currentChatId) {
      currentChatId = "local-" + Date.now();
    }
    saveLocalChat(currentChatId, text.substring(0, 30) + (text.length > 30 ? "..." : ""));
    
    const botElem = document.getElementById(botMsgId);
    if (botElem) {
      const fallbackAns = generateAcademicResponse(text);
      botElem.innerHTML = formatMarkdown(fallbackAns);
    }
    loadChatHistory();
  } finally {
    sendBtn.disabled = false;
    messageInput.focus();
    chatThread.scrollTop = chatThread.scrollHeight;
  }
}

function handleKeyDown(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

  if (button.classList.contains("active")) {

    button.innerHTML = "🌐 Web Search";

}

function searchHistory() {
  const keyword = prompt("Search chat history:");
  if (!keyword) return;
  const items = document.querySelectorAll(".history-item");
  let found = false;
  items.forEach(item => {
    const title = item.querySelector(".history-name").textContent.toLowerCase();
    const match = title.includes(keyword.toLowerCase());
    item.style.display = match ? "block" : "none";
    if (match) found = true;
  });
  if (!found) {
    alert("No matching conversation found.");
    items.forEach(item => item.style.display = "block");
  }
}

const NOTE_DRAFT_KEY = "scholarAI_note_draft";

let lastSavedDraft = { title: "", subject: "", content: "" };
let hasUnsavedNoteChanges = false;

function handleNoteInputChange() {
  hasUnsavedNoteChanges = true;
  const content = document.getElementById("noteModalContent") ? document.getElementById("noteModalContent").value : "";
  const countEl = document.getElementById("noteCharCount");
  if (countEl) countEl.textContent = `${content.length} characters`;

}

async function restoreNoteDraft() {
  let draft = null;

  // 1. Try local storage first
  try {
    const local = localStorage.getItem(NOTE_DRAFT_KEY);
    if (local) {
      draft = JSON.parse(local);
    }
  } catch (e) {
    console.warn("Failed reading draft from localStorage:", e);
  }

  // 2. If no local draft, try remote draft endpoint
  if (!draft || (!draft.title && !draft.content)) {
    try {
      const res = await fetch(`${API_URL}/api/notes/draft`, {
        headers: getAuthHeaders()
      });
      if (res.ok) {
        const data = await res.json();
        if (data && data.draft && (data.draft.title || data.draft.content)) {
          draft = data.draft;
        }
      }
    } catch (e) {
      console.warn("Failed fetching draft from backend:", e);
    }
  }

  if (draft && (draft.title || draft.content)) {
    const titleInput = document.getElementById("noteModalTitle");
    const subjectSelect = document.getElementById("noteModalSubject");
    const contentInput = document.getElementById("noteModalContent");
    const discardBtn = document.getElementById("discardDraftBtn");
    const statusText = document.getElementById("draftStatusText");
    const dot = document.getElementById("draftDot");
    const countEl = document.getElementById("noteCharCount");

    if (titleInput && draft.title) titleInput.value = draft.title;
    if (subjectSelect && draft.subject) subjectSelect.value = draft.subject;
    if (contentInput && draft.content) {
      contentInput.value = draft.content;
      if (countEl) countEl.textContent = `${draft.content.length} characters`;
    }

    lastSavedDraft = {
      title: draft.title || "",
      subject: draft.subject || "General",
      content: draft.content || ""
    };
    hasUnsavedNoteChanges = false;

    if (discardBtn) discardBtn.style.display = "inline-block";
    if (dot) dot.className = "draft-dot";
    const timeLabel = draft.savedAt || (draft.updated_at ? new Date(draft.updated_at).toLocaleTimeString() : "previous session");
    if (statusText) statusText.textContent = `Restored draft from ${timeLabel} (auto-saved)`;
  }
}

async function performAutoSaveNoteDraft() {
  const titleInput = document.getElementById("noteModalTitle");
  const subjectSelect = document.getElementById("noteModalSubject");
  const contentInput = document.getElementById("noteModalContent");

  if (!titleInput || !contentInput) {
    // Modal has been closed
    if (noteAutoSaveTimer) clearInterval(noteAutoSaveTimer);
    return;
  }

  const title = titleInput.value.trim();
  const subject = subjectSelect ? subjectSelect.value : "General";
  const content = contentInput.value;

  // Don't save if all fields are empty
  if (!title && !content) return;

  // Don't re-save if nothing changed
  if (title === lastSavedDraft.title && subject === lastSavedDraft.subject && content === lastSavedDraft.content) {
    return;
  }

  const dot = document.getElementById("draftDot");
  const statusText = document.getElementById("draftStatusText");
  const discardBtn = document.getElementById("discardDraftBtn");

  if (dot) dot.className = "draft-dot saving";
  if (statusText) statusText.textContent = "Auto-saving draft...";

  const timeStr = new Date().toLocaleTimeString();
  const draftPayload = {
    title,
    subject,
    content,
    savedAt: timeStr,
    timestamp: Date.now()
  };

  // 1. Save to localStorage immediately
  try {
    localStorage.setItem(NOTE_DRAFT_KEY, JSON.stringify(draftPayload));
  } catch (e) {
    console.warn("Failed saving draft to localStorage:", e);
  }

  // 2. Save to backend draft endpoint
  try {
    await fetch(`${API_URL}/api/notes/draft`, {
      method: "POST",
      headers: getAuthHeaders(),
      body: JSON.stringify({ title, subject, content })
    });
  } catch (e) {
    // Backend offline or unreachable; local draft is securely retained
  }

  lastSavedDraft = { title, subject, content };
  hasUnsavedNoteChanges = false;

  if (dot) dot.className = "draft-dot";
  if (statusText) statusText.textContent = `Auto-saved draft at ${timeStr} (Local & Cloud)`;
  if (discardBtn) discardBtn.style.display = "inline-block";
}

async function discardNoteDraft() {
  if (!confirm("Are you sure you want to discard this draft and clear all unsaved content?")) return;

  // Clear localStorage
  try {
    localStorage.removeItem(NOTE_DRAFT_KEY);
  } catch (e) {}

  // Clear backend draft
  try {
    await fetch(`${API_URL}/api/notes/draft`, {
      method: "DELETE",
      headers: getAuthHeaders()
    });
  } catch (e) {}

  lastSavedDraft = { title: "", subject: "", content: "" };
  hasUnsavedNoteChanges = false;

  const titleInput = document.getElementById("noteModalTitle");
  const contentInput = document.getElementById("noteModalContent");
  const discardBtn = document.getElementById("discardDraftBtn");
  const statusText = document.getElementById("draftStatusText");
  const dot = document.getElementById("draftDot");
  const countEl = document.getElementById("noteCharCount");

  if (titleInput) titleInput.value = "";
  if (contentInput) contentInput.value = "";
  if (countEl) countEl.textContent = "0 characters";
  if (discardBtn) discardBtn.style.display = "none";
  if (dot) dot.className = "draft-dot";
  if (statusText) statusText.textContent = "Draft discarded. Ready for new note.";

  showToast("Draft discarded");
}

function closeCreateNoteModal() {
  // If there are unsaved edits, do a final auto-save so user doesn't lose text
  if (hasUnsavedNoteChanges) {
    performAutoSaveNoteDraft();
    showToast("Draft auto-saved. You can resume editing anytime.");
  }
  if (noteAutoSaveTimer) clearInterval(noteAutoSaveTimer);
  closeModal();
}

async function submitCreateNoteModal() {
  const titleInput = document.getElementById("noteModalTitle");
  const subjectSelect = document.getElementById("noteModalSubject");
  const contentInput = document.getElementById("noteModalContent");
  const submitBtn = document.getElementById("saveNoteSubmitBtn");

  const title = titleInput ? titleInput.value.trim() : "";
  const subject = subjectSelect ? subjectSelect.value : "General";
  const content = contentInput ? contentInput.value.trim() : "";

  if (!title) {
    showToast("Please enter a note title");
    if (titleInput) titleInput.focus();
    return;
  }
  if (!content) {
    showToast("Please enter note content");
    if (contentInput) contentInput.focus();
    return;
  }

  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner" style="width:13px;height:13px;border-width:2px;margin-right:5px;"></span> Creating...';
  }

  try {
    const res = await fetch(`${API_URL}/api/notes`, {
      method: "POST",
      headers: getAuthHeaders(),
      body: JSON.stringify({ title, subject, content })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Failed to create note");

    // Clean up draft since note is successfully created
    if (noteAutoSaveTimer) clearInterval(noteAutoSaveTimer);
    try {
      localStorage.removeItem(NOTE_DRAFT_KEY);
    } catch (e) {}
    try {
      await fetch(`${API_URL}/api/notes/draft`, {
        method: "DELETE",
        headers: getAuthHeaders()
      });
    } catch (e) {}

    lastSavedDraft = { title: "", subject: "", content: "" };
    hasUnsavedNoteChanges = false;

    closeModal();
    showToast("Note created successfully!");
    loadNotes();
  } catch (err) {
    // If backend is offline, save to local notes array so student doesn't lose note
    const newLocalNote = {
      id: "note-" + Date.now(),
      title,
      subject,
      content,
      favorite: false,
      source: "manual"
    };
    allNotes.unshift(newLocalNote);
    try {
      localStorage.removeItem(NOTE_DRAFT_KEY);
    } catch (e) {}
    if (noteAutoSaveTimer) clearInterval(noteAutoSaveTimer);
    lastSavedDraft = { title: "", subject: "", content: "" };
    hasUnsavedNoteChanges = false;
    closeModal();
    applyNoteFilters();
    showToast("Note saved locally!");
  }
}

async function uploadPDF(event) {
  const file = event.target.files[0];
  if (!file) return;

  showToast(`Uploading and extracting "${file.name}"...`);
  const formData = new FormData();
  formData.append("file", file);

  try {
    const token = currentToken();
    const headers = {};
    if (token) headers["Authorization"] = `Bearer ${token}`;

    const res = await fetch(`${API_URL}/api/notes/upload-pdf`, {
      method: "POST",
      headers: headers,
      body: formData
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "PDF upload failed");

    showToast("PDF uploaded and processed successfully!");
    loadNotes();
  } catch (err) {
    console.warn("Backend failed, falling back to local PDF extraction...", err);
    
    // Local fallback using pdf.js
    if (!window.pdfjsLib) {
      showToast("Loading local PDF engine...");
      await new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js";
        script.onload = () => resolve();
        script.onerror = () => reject(new Error("Failed to load PDF engine"));
        document.head.appendChild(script);
      });
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
    }
    
    try {
      showToast("Extracting text locally...");
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await window.pdfjsLib.getDocument({data: arrayBuffer}).promise;
      let text = "";
      // Only extract first 10 pages locally for performance
      const maxPages = Math.min(pdf.numPages, 10);
      for (let i = 1; i <= maxPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        const strings = content.items.map(item => item.str);
        text += strings.join(" ") + "\n\n";
      }
      
      const newLocalNote = {
        id: "pdf-" + Date.now(),
        title: file.name.replace(".pdf", ""),
        subject: "PDF Uploads",
        content: text || "No text extracted from PDF.",
        favorite: false,
        source: "pdf"
      };
      allNotes.unshift(newLocalNote);
      try { localStorage.setItem("scholarAILocalNotes", JSON.stringify(allNotes)); } catch(e){}
      applyNoteFilters();
      showToast("PDF extracted locally!");
    } catch (e) {
      showToast("Failed to read PDF locally");
      console.error(e);
    }
  } finally {
    event.target.value = "";
  }
}

async function toggleFavorite(id) {
  const note = allNotes.find(n => n.id === id);
  if (!note) return;
  const newFav = !note.favorite;

  try {
    const res = await fetch(`${API_URL}/api/notes/${id}/favorite`, {
      method: "PUT",
      headers: getAuthHeaders(),
      body: JSON.stringify({ favorite: newFav })
    });
    if (res.ok) {
      note.favorite = newFav;
      applyNoteFilters();
    } else {
      throw new Error();
    }
  } catch (err) {
    note.favorite = newFav;
    try { localStorage.setItem("scholarAILocalNotes", JSON.stringify(allNotes)); } catch(e){}
    applyNoteFilters();
  }
}

async function deleteNote(id) {
  if (!confirm("Delete this note?")) return;

  try {
    const res = await fetch(`${API_URL}/api/notes/${id}`, {
      method: "DELETE",
      headers: getAuthHeaders()
    });
    if (!res.ok) throw new Error("Failed to delete note");
    showToast("Note deleted");
    loadNotes();
  } catch (err) {
    allNotes = allNotes.filter(n => n.id !== id);
    try { localStorage.setItem("scholarAILocalNotes", JSON.stringify(allNotes)); } catch(e){}
    applyNoteFilters();
    showToast("Note removed (locally)");
  }
}

async function runAITool(tool) {
  if (!selectedNoteId) {
    showToast("Please select a note card first!");
    return;
  }
  const note = allNotes.find(n => n.id === selectedNoteId);
  showToast(`Running "${tool}" on "${note ? note.title : "note"}"...`);

  try {
    const res = await fetch(`${API_URL}/api/notes/ai-tool`, {
      method: "POST",
      headers: getAuthHeaders(),
      body: JSON.stringify({ note_id: selectedNoteId, tool: tool })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "AI tool execution failed");

    showModal(`${tool}: ${note ? note.title : "Study Note"}`, data.answer);
  } catch (err) {
    let fallbackText = "";
    const noteContent = note ? note.content : "";
    const noteTitle = note ? note.title : "Note";

    if (tool === "Deep Research & Synthesis") {
      fallbackText = `### Deep Research Synthesis: ${noteTitle}\n\n` +
        `#### Conceptual Decomposition\n` +
        `- **Core Domain**: ${note ? note.subject : "Academic Studies"}\n` +
        `- **Theoretical Basis**: In-depth analysis of ${noteTitle} fundamentals and academic literature.\n\n` +
        `#### In-Depth Synthesis\n` +
        `${noteContent}\n\n` +
        `#### Recommended Research Directions\n` +
        `1. Comparative benchmarking across multi-task academic evaluations.\n` +
        `2. Domain-specific retrieval augmentation (RAG) vector embeddings.\n` +
        `3. Dynamic memory indexing for comprehensive mastery.`;
    } else {
      fallbackText = `### ${tool}: ${noteTitle}\n\nAnalysis for "${noteTitle}":\n\n- **Summary**: ${noteContent}\n- **Study Tip**: Review key terminology and create active recall flashcards.`;
    }

    showModal(`${tool}: ${noteTitle}`, fallbackText);
  }
}

function filterNotes(type, btn) {
  currentNotesFilter = type;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  applyNoteFilters();
}

function applyNoteFilters() {
  const search = (document.getElementById("searchInput") ? document.getElementById("searchInput").value : "").toLowerCase();
  const subject = document.getElementById("subjectFilter") ? document.getElementById("subjectFilter").value : "all";
  const filtered = allNotes.filter(note => {
    const matchesSearch = (note.title || "").toLowerCase().includes(search) || (note.content || "").toLowerCase().includes(search);
    const matchesSubject = subject === "all" || note.subject === subject;
    const matchesFilter = currentNotesFilter === "all" || (currentNotesFilter === "favorites" && note.favorite);
    return matchesSearch && matchesSubject && matchesFilter;
  });
  renderNotes(filtered);
}

function renderChart(type) {

  if (!bars) return;
  const data = chartDatasets[type];
  const max = type === "hours" ? 4 : 7;
  const suffix = type === "hours" ? "h" : "";
  yLabels.innerHTML = [1, 0.75, 0.5, 0.25, 0].map(f => `<span>${Math.round(max * f * 10) / 10}${suffix}</span>`).join("");
  bars.innerHTML = data.map(x => {
    const darkH = (x.dark / max) * 150;
    const lightH = (x.light / max) * 65;
    return `<div class="bar-group"><div class="bar-stack"><div class="bar-light" style="height:${lightH}px"></div><div class="bar-dark" style="height:${darkH}px"></div></div><div class="day">${x.d}</div></div>`;
  }).join("");

let currentTheme = "light";

async function loadSettingsData(user) {
  if (user) {
    document.getElementById("settingsName").value = user.name || "";
    document.getElementById("settingsEmail").value = user.email || "";
  }

  try {
    const profRes = await fetch(`${API_URL}/api/profile`, { headers: getAuthHeaders() });
    if (profRes.ok) {
      const pData = await profRes.json();
      if (pData.user) {
        document.getElementById("settingsName").value = pData.user.name || "";
        document.getElementById("settingsEmail").value = pData.user.email || "";
        if (pData.user.course) document.getElementById("settingsCourse").value = pData.user.course;
        if (pData.user.college) document.getElementById("settingsCollege").value = pData.user.college;
      }
    }

    const setRes = await fetch(`${API_URL}/api/setting`, { headers: getAuthHeaders() });
    if (setRes.ok) {
      const sData = await setRes.json();
      const s = sData.settings || {};
      if (s.response_style) document.getElementById("settingsStyle").value = s.response_style;
      if (s.language) document.getElementById("settingsLanguage").value = s.language;
      if (s.show_sources === false) document.getElementById("toggleSources").classList.remove("on");
      if (s.ai_suggestions === false) document.getElementById("toggleSuggestions").classList.remove("on");
      document.getElementById("notif-study").checked = s.notif_study !== false;
      document.getElementById("notif-quiz").checked = s.notif_quiz !== false;
      document.getElementById("notif-digest").checked = s.notif_digest === true;
      if (s.theme) {
        currentTheme = s.theme;
        localStorage.setItem("scholarAITheme", currentTheme);
        applyStoredTheme();
        document.querySelectorAll(".theme-switch button").forEach(b => b.classList.remove("active"));
        const btn = document.getElementById(`theme-${s.theme}`);
        if (btn) btn.classList.add("active");
      }
    }
  } catch (err) {
    console.warn("Settings fetch fallback:", err);
  }
}

function setTheme(theme, btn) {
  currentTheme = theme;
  document.querySelectorAll(".theme-switch button").forEach(b => b.classList.remove("active"));

async function saveSettingsChanges() {
  const saveBtn = document.getElementById("saveSettingsBtn");
  saveBtn.disabled = true;
  saveBtn.innerHTML = '<span class="spinner"></span> Saving...';

  const name = document.getElementById("settingsName").value.trim();
  const email = document.getElementById("settingsEmail").value.trim();
  const course = document.getElementById("settingsCourse").value.trim();
  const college = document.getElementById("settingsCollege").value.trim();

  const settingsPayload = {
    theme: currentTheme,
    language: document.getElementById("settingsLanguage").value,
    response_style: document.getElementById("settingsStyle").value,
    show_sources: document.getElementById("toggleSources").classList.contains("on"),
    ai_suggestions: document.getElementById("toggleSuggestions").classList.contains("on"),
    notif_study: document.getElementById("notif-study").checked,
    notif_quiz: document.getElementById("notif-quiz").checked,
    notif_digest: document.getElementById("notif-digest").checked
  };

  const profilePayload = { name, email, course, college };
  if (pendingAvatarDataUrl) {
    profilePayload.avatar = pendingAvatarDataUrl;
  }

  try {
    const profRes = await fetch(`${API_URL}/api/profile`, {
      method: "PUT",
      headers: getAuthHeaders(),
      body: JSON.stringify(profilePayload)
    });

    await fetch(`${API_URL}/api/setting`, {
      method: "PUT",
      headers: getAuthHeaders(),
      body: JSON.stringify(settingsPayload)
    });

    const user = currentUser() || {};
    user.name = name;
    user.email = email;
    if (pendingAvatarDataUrl) {
      user.avatar = pendingAvatarDataUrl;
    }
    localStorage.setItem(STORAGE.user, JSON.stringify(user));
    const nameDisplay = document.getElementById("userNameDisplay");
    if (nameDisplay) nameDisplay.textContent = name || "Student";
    
    // Update top avatar and sidebar avatar if they exist
    document.querySelectorAll(".top-avatar, .profile img").forEach(img => {
      if (user.avatar) img.src = user.avatar;
    });

    showToast("Settings saved successfully!");
  } catch (err) {
    showToast("Saved settings locally");
  } finally {
    saveBtn.disabled = false;
    saveBtn.innerHTML = '<i data-lucide="save"></i> Save Changes';
    if (window.lucide) lucide.createIcons();
  }
}

async function securityAction(action) {
  if (action === "Change Password") {
    const newPass = prompt("Enter new password (minimum 6 characters):");
    if (!newPass) return;
    if (newPass.length < 6) {
      alert("Password must be at least 6 characters.");
      return;
    }
    
    try {
      const res = await fetch(`${API_URL}/api/profile/password`, {
        method: "PUT",
        headers: getAuthHeaders(),
        body: JSON.stringify({ new_password: newPass })
      });
      const data = await res.json();
      if (res.ok) {
        showToast("Password updated successfully!");
      } else {
        alert(data.detail || "Failed to update password");
      }
    } catch (err) {
      // Local fallback for no-backend environment
      let accounts = [];
      try { accounts = JSON.parse(localStorage.getItem("scholarAILocalAccounts")) || []; } catch(e){}
      const currentEmail = currentUser()?.email;
      if (currentEmail) {
        const acc = accounts.find(a => a.email === currentEmail);
        if (acc) {
          acc.password = newPass;
          localStorage.setItem("scholarAILocalAccounts", JSON.stringify(accounts));
        }
      }
      showToast("Password updated (locally)!");
    }
  }
}

async function clearChatHistoryAction() {
  if (!confirm("Are you sure you want to clear all chat history?")) return;
  try {
    await fetch(`${API_URL}/api/chat`, {
      method: "DELETE",
      headers: getAuthHeaders()
    });
    currentChatId = null;
    clearLocalChats();
    showToast("Chat history cleared!");
  } catch (err) {
    currentChatId = null;
    clearLocalChats();
    showToast("Chat history cleared (locally)");
  }
}

async function deleteAccount() {
  if (confirm("Are you sure you want to delete your account? This action cannot be undone.")) {
    try {
      await fetch(`${API_URL}/api/profile`, {
        method: "DELETE",
        headers: getAuthHeaders()
      });
    } catch (e) {
      // Local fallback
      let accounts = [];
      try { accounts = JSON.parse(localStorage.getItem("scholarAILocalAccounts")) || []; } catch(err){}
      const currentEmail = currentUser()?.email;
      if (currentEmail) {
        accounts = accounts.filter(a => a.email !== currentEmail);
        localStorage.setItem("scholarAILocalAccounts", JSON.stringify(accounts));
      }
    }
    showToast("Account deleted");
    setTimeout(() => logout(), 1200);
  }
}
</script>
